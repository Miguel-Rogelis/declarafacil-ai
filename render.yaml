# Blueprint de Render: un solo servicio web gratuito (API + sitio).
services:
  - type: web
    name: declarafacil
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # Cuentas (opcional): proyecto de Supabase; ver «Cuentas» en el README
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: APP_URL
        value: https://declarafacil.onrender.com

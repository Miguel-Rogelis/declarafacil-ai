    <meta charset="UTF-8" />

    <meta name="description" content="Sube tu reporte de exógena y obtén un borrador de tu declaración de renta explicado en lenguaje simple." />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // Tema antes de pintar, para que no parpadee: lo guardado o lo que pida el sistema
      try {
        var t = localStorage.getItem("df-tema");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>DeclaraFácil — tu declaración de renta, lista para revisar</title>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

# En cada cambio: las pruebas del backend, la construcción del front y la prueba de punta a punta
# en un navegador (escritorio y celular), con el backend en modo simulado (sin IA ni llave).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    # 24.04 fijo: Playwright todavía no instala sus navegadores en Ubuntu 26.04 (el nuevo ubuntu-latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend · dependencias (y Tesseract para las pruebas de OCR)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa
          pip install -r backend/requirements-dev.txt
      - name: Backend · pruebas
        working-directory: backend
        run: python -m pytest -q
      - name: Backend · carga y costo (10 declaraciones a la vez, latencia del modelo acelerada)
        working-directory: backend
        run: python scripts/carga.py --declaraciones 10 --concurrencia 10 --escala 0.05 > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Front · dependencias
        working-directory: frontend
        run: npm ci
      - name: Front · tipos y construcción
        working-directory: frontend
        run: npm run build

      - name: Navegador para la prueba de punta a punta
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prueba de punta a punta (escritorio y celular)
        working-directory: frontend
        env:
          PYTHON: python
        run: npx playwright test
      - name: Extensión de Chrome (contra páginas que imitan a MUISCA) y paquete para la tienda
        run: |
          node extension/pruebas/probar.mjs
          python extension/tienda/empaquetar.py --tienda
      - name: Rastro de la prueba si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-playwright
          path: frontend/test-results
          retention-days: 7
